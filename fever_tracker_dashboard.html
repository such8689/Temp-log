<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Fever & Medication Tracker</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }

        input[type="color"] {
            padding: 0;
            border: none;
            background: transparent;
        }
    </style>
</head>

<body class="bg-gray-50">
    <div class="min-h-screen flex flex-col">
        <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-6 shadow-lg">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-3xl font-bold">🌡️ Family Fever & Medication Tracker</h1>
                <p class="text-blue-100 mt-1">Track temperatures and medications across multiple profiles</p>
            </div>
        </header>

        <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">

            <aside class="lg:col-span-1 bg-white rounded-lg shadow-md p-6 h-fit">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Profiles</h2>

                <div id="profileList" class="space-y-2 mb-4"></div>

                <div class="flex gap-2 mb-6">
                    <input
                        id="newProfileInput"
                        type="text"
                        placeholder="New profile name"
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                    >

                    <button
                        onclick="addProfile()"
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold"
                    >
                        +
                    </button>
                </div>

                <hr class="mb-6">

                <h3 class="font-bold text-gray-800 mb-3">Medications</h3>

                <div id="medicationList" class="space-y-2 mb-4 max-h-48 overflow-y-auto"></div>

                <div class="flex gap-2 mb-4">
                    <input
                        id="newMedicationInput"
                        type="text"
                        placeholder="Medication name"
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm"
                    >

                    <button
                        onclick="addMedication()"
                        class="px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm font-semibold"
                    >
                        +
                    </button>
                </div>

                <hr class="mb-6">
                <div class="space-y-2 mb-4">
                    <button
                        onclick="exportDataAsJson()"
                        class="w-full px-4 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition-colors font-semibold text-sm"
                    >
                        ⬇️ Export JSON
                    </button>
                
                    <label
                        for="importJsonInput"
                        class="block w-full px-4 py-2 bg-gray-700 text-white rounded-lg hover:bg-gray-800 transition-colors font-semibold text-sm text-center cursor-pointer"
                    >
                        ⬆️ Import JSON
                    </label>
                
                    <input
                        id="importJsonInput"
                        type="file"
                        accept="application/json,.json"
                        onchange="importDataFromJson(event)"
                        class="hidden"
                    >
                </div>
                
                <button
                    onclick="clearAllData()"
                    class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-semibold text-sm"
                >
                    🗑️ Clear All Data / Start New Illness
                </button>
            
            </aside>

            <section class="lg:col-span-3 space-y-6">

                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Log Temperature & Medication</h2>

                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Temperature (°F)</label>
                            <input
                                id="tempInput"
                                type="number"
                                placeholder="98.6"
                                min="95"
                                max="106"
                                step="0.1"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Date</label>
                            <input
                                id="dateInput"
                                type="date"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Time</label>
                            <input
                                id="timeInput"
                                type="time"
                                step="900"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            >
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Medication</label>
                            <select
                                id="medicationSelect"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            >
                                <option value="">— None —</option>
                            </select>
                        </div>
                    </div>

                    <button
                        onclick="logEntry()"
                        class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-bold"
                    >
                        Log Entry
                    </button>
                </div>

                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-2">Temperature Timeline</h2>
                    <p class="text-sm text-gray-500 mb-4">
                        Click any chart point to edit that log. The x-axis shows date above time in 3-hour blocks.
                    </p>

                    <div style="position: relative; height: 420px;">
                        <canvas id="feverChart"></canvas>
                    </div>
                </div>

                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Recent Logs</h2>
                    <div id="logHistory" class="space-y-2 max-h-64 overflow-y-auto"></div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Log Modal -->
    <div id="editLogModal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-md">
            <h2 class="text-xl font-bold text-gray-800 mb-4">Edit Log Entry</h2>

            <input id="editLogId" type="hidden">

            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Temperature (°F)</label>
                    <input
                        id="editTempInput"
                        type="number"
                        min="95"
                        max="106"
                        step="0.1"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Date</label>
                    <input
                        id="editDateInput"
                        type="date"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Time</label>
                    <input
                        id="editTimeInput"
                        type="time"
                        step="900"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">Medication</label>
                    <select
                        id="editMedicationSelect"
                        class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none"
                    >
                        <option value="">— None —</option>
                    </select>
                </div>
            </div>

            <div class="flex gap-3 mt-6">
                <button
                    onclick="saveEditedLog()"
                    class="flex-1 px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 font-semibold"
                >
                    Save Changes
                </button>

                <button
                    onclick="closeEditModal()"
                    class="flex-1 px-4 py-2 bg-gray-300 text-gray-800 rounded-lg hover:bg-gray-400 font-semibold"
                >
                    Cancel
                </button>
            </div>
        </div>
    </div>

    <script>
        // ==================== App State ====================
        let state = {
            profiles: [],
            medications: [],
            logs: [],
            activeProfileId: null
        };

        let chartInstance = null;

        const NORMAL_BODY_TEMP = 98.6;
        const THREE_HOURS_MS = 3 * 60 * 60 * 1000;

        const colorPalette = [
            '#EF4444',
            '#F97316',
            '#EAB308',
            '#22C55E',
            '#06B6D4',
            '#3B82F6',
            '#8B5CF6',
            '#EC4899',
            '#D946EF',
            '#6366F1',
            '#F59E0B',
            '#10B981',
            '#14B8A6',
            '#0891B2',
            '#6D28D9'
        ];

        // ==================== Initialization ====================
        window.addEventListener('DOMContentLoaded', function() {
            loadState();
            setCurrentDateTime();
            bindEnterKeys();
            renderAll();

            document.getElementById('editLogModal').addEventListener('click', function(event) {
                if (event.target === this) {
                    closeEditModal();
                }
            });
        });

        function bindEnterKeys() {
            document.getElementById('newProfileInput').addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    addProfile();
                }
            });

            document.getElementById('newMedicationInput').addEventListener('keydown', function(event) {
                if (event.key === 'Enter') {
                    addMedication();
                }
            });
        }

        function renderAll() {
            renderProfiles();
            renderMedications();
            updateMedicationSelect();
            renderLogs();
            updateChart();
        }

        function setCurrentDateTime() {
            const now = new Date();

            document.getElementById('dateInput').valueAsDate = now;

            let roundedMinutes = Math.round(now.getMinutes() / 15) * 15;
            let hours = now.getHours();

            if (roundedMinutes === 60) {
                roundedMinutes = 0;
                hours = (hours + 1) % 24;
            }

            document.getElementById('timeInput').value =
                `${String(hours).padStart(2, '0')}:${String(roundedMinutes).padStart(2, '0')}`;
        }

        // ==================== Profiles ====================
        function addProfile() {
            const input = document.getElementById('newProfileInput');
            const name = input.value.trim();

            if (!name) {
                return;
            }

            const profile = {
                id: Date.now(),
                name: name
            };

            state.profiles.push(profile);

            if (!state.activeProfileId) {
                state.activeProfileId = profile.id;
            }

            input.value = '';

            saveState();
            renderAll();
        }

        function deleteProfile(id) {
            const profile = state.profiles.find(function(p) {
                return p.id === id;
            });

            if (!profile) {
                return;
            }

            if (!confirm(`Delete profile "${profile.name}" and all logs for this profile?`)) {
                return;
            }

            state.profiles = state.profiles.filter(function(p) {
                return p.id !== id;
            });

            state.logs = state.logs.filter(function(log) {
                return log.profileId !== id;
            });

            if (state.activeProfileId === id) {
                state.activeProfileId = state.profiles.length > 0 ? state.profiles[0].id : null;
            }

            saveState();
            renderAll();
        }

        function selectProfile(id) {
            state.activeProfileId = id;
            saveState();
            renderAll();
        }

        function renameProfile(id) {
            const profile = state.profiles.find(function(p) {
                return p.id === id;
            });

            if (!profile) {
                return;
            }

            const newName = prompt(`Rename "${profile.name}" to:`, profile.name);

            if (!newName || !newName.trim()) {
                return;
            }

            profile.name = newName.trim();

            saveState();
            renderProfiles();
        }

        function renderProfiles() {
            const container = document.getElementById('profileList');

            if (state.profiles.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">No profiles yet. Add one above.</p>';
                return;
            }

            container.innerHTML = state.profiles.map(function(profile) {
                const activeClass = profile.id === state.activeProfileId
                    ? 'bg-blue-100 border-2 border-blue-600'
                    : 'bg-gray-100 border-2 border-gray-200';

                return `
                    <div class="p-3 rounded-lg transition-colors ${activeClass}">
                        <div class="flex items-center justify-between mb-2">
                            <button
                                onclick="selectProfile(${profile.id})"
                                class="flex-1 text-left font-semibold text-gray-800 hover:text-blue-600 transition-colors"
                            >
                                👤 ${escapeHtml(profile.name)}
                            </button>
                        </div>

                        <div class="flex gap-1 text-xs">
                            <button
                                onclick="renameProfile(${profile.id})"
                                class="flex-1 px-2 py-1 bg-blue-500 text-white rounded hover:bg-blue-600 transition-colors"
                            >
                                ✎
                            </button>

                            <button
                                onclick="deleteProfile(${profile.id})"
                                class="flex-1 px-2 py-1 bg-red-500 text-white rounded hover:bg-red-600 transition-colors"
                            >
                                ✕
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==================== Medications ====================
        function addMedication() {
            const input = document.getElementById('newMedicationInput');
            const name = input.value.trim();

            if (!name) {
                return;
            }

            const medication = {
                id: Date.now(),
                name: name,
                color: colorPalette[state.medications.length % colorPalette.length]
            };

            state.medications.push(medication);
            input.value = '';

            saveState();
            renderMedications();
            updateMedicationSelect();
            updateChart();
            renderLogs();
        }

        function deleteMedication(id) {
            const medication = state.medications.find(function(med) {
                return med.id === id;
            });

            if (!medication) {
                return;
            }

            if (!confirm(`Delete medication "${medication.name}"? Existing logs will keep the temperature but remove this medication.`)) {
                return;
            }

            state.medications = state.medications.filter(function(med) {
                return med.id !== id;
            });

            state.logs.forEach(function(log) {
                if (log.medicationId === id) {
                    log.medicationId = null;
                }
            });

            saveState();
            renderAll();
        }

        function changeMedicationColor(id, color) {
            const medication = state.medications.find(function(med) {
                return med.id === id;
            });

            if (!medication) {
                return;
            }

            medication.color = color;

            saveState();
            renderMedications();
            updateChart();
            renderLogs();
        }

        function renderMedications() {
            const container = document.getElementById('medicationList');

            if (state.medications.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-xs">No medications yet. Add one above.</p>';
                return;
            }

            container.innerHTML = state.medications.map(function(med) {
                return `
                    <div class="p-2 bg-gray-50 rounded-lg">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center gap-2 flex-1">
                                <input
                                    type="color"
                                    value="${med.color}"
                                    onchange="changeMedicationColor(${med.id}, this.value)"
                                    class="w-8 h-8 cursor-pointer"
                                    title="Change medication color"
                                >

                                <span class="text-sm text-gray-700">${escapeHtml(med.name)}</span>
                            </div>

                            <button
                                onclick="deleteMedication(${med.id})"
                                class="text-xs px-2 py-1 text-red-600 hover:bg-red-100 rounded transition-colors"
                            >
                                ✕
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateMedicationSelect() {
            const select = document.getElementById('medicationSelect');

            select.innerHTML = '<option value="">— None —</option>' + state.medications.map(function(med) {
                return `<option value="${med.id}">${escapeHtml(med.name)}</option>`;
            }).join('');
        }

        // ==================== Logs ====================
        function logEntry() {
            if (!state.activeProfileId) {
                alert('Please create a profile first.');
                return;
            }

            const tempValue = document.getElementById('tempInput').value;
            const date = document.getElementById('dateInput').value;
            const time = document.getElementById('timeInput').value;
            const medicationId = document.getElementById('medicationSelect').value;

            const temp = parseFloat(tempValue);

            if (Number.isNaN(temp) || !date || !time) {
                alert('Please fill in temperature, date, and time.');
                return;
            }

            if (temp < 95 || temp > 106) {
                if (!confirm('This temperature is outside the usual range. Save it anyway?')) {
                    return;
                }
            }

            const timestamp = new Date(`${date}T${time}`).getTime();

            if (Number.isNaN(timestamp)) {
                alert('Invalid date or time.');
                return;
            }

            const entry = {
                id: Date.now(),
                profileId: state.activeProfileId,
                temperature: temp,
                timestamp: timestamp,
                medicationId: medicationId ? parseInt(medicationId, 10) : null
            };

            state.logs.push(entry);

            state.logs.sort(function(a, b) {
                return a.timestamp - b.timestamp;
            });

            saveState();

            document.getElementById('tempInput').value = '';

            renderLogs();
            updateChart();
            setCurrentDateTime();
        }

        function deleteLog(id) {
            if (!confirm('Delete this log entry?')) {
                return;
            }

            state.logs = state.logs.filter(function(log) {
                return log.id !== id;
            });

            saveState();
            renderLogs();
            updateChart();
        }

        function renderLogs() {
            const container = document.getElementById('logHistory');

            if (!state.activeProfileId) {
                container.innerHTML = '<p class="text-gray-500 text-sm">Create or select a profile to begin.</p>';
                return;
            }

            const profileLogs = state.logs.filter(function(log) {
                return log.profileId === state.activeProfileId;
            });

            if (profileLogs.length === 0) {
                container.innerHTML = '<p class="text-gray-500 text-sm">No logs yet. Add one above.</p>';
                return;
            }

            container.innerHTML = profileLogs.slice().reverse().map(function(log) {
                const date = new Date(log.timestamp);
                const medication = state.medications.find(function(med) {
                    return med.id === log.medicationId;
                });

                const dateStr = date.toLocaleDateString([], {
                    month: 'short',
                    day: 'numeric',
                    year: 'numeric'
                });

                const timeStr = date.toLocaleTimeString([], {
                    hour: 'numeric',
                    minute: '2-digit'
                });

                const medicationHtml = medication
                    ? `
                        <div class="text-xs text-gray-500 flex items-center gap-1 mt-1">
                            <span style="background-color: ${medication.color}; width: 10px; height: 10px; border-radius: 2px; display: inline-block;"></span>
                            💊 ${escapeHtml(medication.name)}
                        </div>
                    `
                    : '';

                return `
                    <div class="p-3 bg-gray-50 rounded-lg flex justify-between items-center gap-3">
                        <div class="flex-1">
                            <div class="font-semibold text-gray-800">${log.temperature}°F</div>
                            <div class="text-sm text-gray-600">${dateStr} @ ${timeStr}</div>
                            ${medicationHtml}
                        </div>

                        <div class="flex gap-2">
                            <button
                                onclick="openEditLog(${log.id})"
                                class="px-3 py-1 text-blue-600 hover:bg-blue-100 rounded transition-colors text-sm"
                            >
                                Edit
                            </button>

                            <button
                                onclick="deleteLog(${log.id})"
                                class="px-3 py-1 text-red-600 hover:bg-red-100 rounded transition-colors text-sm"
                            >
                                ✕
                            </button>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // ==================== Edit Log Modal ====================
        function openEditLog(logId) {
            const log = state.logs.find(function(item) {
                return item.id === logId;
            });

            if (!log) {
                return;
            }

            const date = new Date(log.timestamp);

            document.getElementById('editLogId').value = log.id;
            document.getElementById('editTempInput').value = log.temperature;

            document.getElementById('editDateInput').value =
                `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;

            document.getElementById('editTimeInput').value =
                `${String(date.getHours()).padStart(2, '0')}:${String(date.getMinutes()).padStart(2, '0')}`;

            const select = document.getElementById('editMedicationSelect');

            select.innerHTML = '<option value="">— None —</option>' + state.medications.map(function(med) {
                const selected = log.medicationId === med.id ? 'selected' : '';
                return `<option value="${med.id}" ${selected}>${escapeHtml(med.name)}</option>`;
            }).join('');

            document.getElementById('editLogModal').classList.remove('hidden');
        }

        function closeEditModal() {
            document.getElementById('editLogModal').classList.add('hidden');
        }

        function saveEditedLog() {
            const logId = parseInt(document.getElementById('editLogId').value, 10);

            const log = state.logs.find(function(item) {
                return item.id === logId;
            });

            if (!log) {
                return;
            }

            const temp = parseFloat(document.getElementById('editTempInput').value);
            const date = document.getElementById('editDateInput').value;
            const time = document.getElementById('editTimeInput').value;
            const medicationId = document.getElementById('editMedicationSelect').value;

            if (Number.isNaN(temp) || !date || !time) {
                alert('Please fill in temperature, date, and time.');
                return;
            }

            if (temp < 95 || temp > 106) {
                if (!confirm('This temperature is outside the usual range. Save it anyway?')) {
                    return;
                }
            }

            const timestamp = new Date(`${date}T${time}`).getTime();

            if (Number.isNaN(timestamp)) {
                alert('Invalid date or time.');
                return;
            }

            log.temperature = temp;
            log.timestamp = timestamp;
            log.medicationId = medicationId ? parseInt(medicationId, 10) : null;

            state.logs.sort(function(a, b) {
                return a.timestamp - b.timestamp;
            });

            saveState();
            closeEditModal();
            renderLogs();
            updateChart();
        }

        // ==================== Chart Helpers ====================
        function floorToThreeHourBlock(timestamp) {
            const date = new Date(timestamp);
            date.setMinutes(0, 0, 0);
            date.setHours(Math.floor(date.getHours() / 3) * 3);
            return date.getTime();
        }

        function ceilToThreeHourBlock(timestamp) {
            const floored = floorToThreeHourBlock(timestamp);

            if (floored === timestamp) {
                return floored;
            }

            return floored + THREE_HOURS_MS;
        }

        function startOfLocalDay(timestamp) {
            const date = new Date(timestamp);
            date.setHours(0, 0, 0, 0);
            return date.getTime();
        }

        function addOneLocalDay(timestamp) {
            const date = new Date(timestamp);
            date.setDate(date.getDate() + 1);
            date.setHours(0, 0, 0, 0);
            return date.getTime();
        }

        function isLocalMidnight(timestamp) {
            if (timestamp === null || timestamp === undefined || Number.isNaN(Number(timestamp))) {
                return false;
            }

            const date = new Date(Number(timestamp));

            return date.getHours() === 0 && date.getMinutes() === 0;
        }

        // ==================== Chart Plugins ====================
        const dayBackgroundPlugin = {
            id: 'dayBackgroundPlugin',

            beforeDatasetsDraw: function(chart) {
                const xScale = chart.scales.x;
                const chartArea = chart.chartArea;
                const ctx = chart.ctx;

                if (!xScale || !chartArea) {
                    return;
                }

                let dayStart = startOfLocalDay(xScale.min);

                if (dayStart > xScale.min) {
                    const tempDate = new Date(dayStart);
                    tempDate.setDate(tempDate.getDate() - 1);
                    dayStart = tempDate.getTime();
                }

                let dayIndex = 0;

                ctx.save();

                while (dayStart < xScale.max) {
                    const nextDayStart = addOneLocalDay(dayStart);

                    const left = Math.max(chartArea.left, xScale.getPixelForValue(dayStart));
                    const right = Math.min(chartArea.right, xScale.getPixelForValue(nextDayStart));

                    if (right > chartArea.left && left < chartArea.right && dayIndex % 2 === 0) {
                        ctx.fillStyle = 'rgba(59, 130, 246, 0.04)';
                        ctx.fillRect(left, chartArea.top, right - left, chartArea.bottom - chartArea.top);
                    }

                    dayStart = nextDayStart;
                    dayIndex++;
                }

                ctx.restore();
            }
        };

        const normalBodyTempPlugin = {
            id: 'normalBodyTempPlugin',

            afterDraw: function(chart) {
                const yScale = chart.scales.y;
                const chartArea = chart.chartArea;
                const ctx = chart.ctx;

                if (!yScale || !chartArea) {
                    return;
                }

                if (NORMAL_BODY_TEMP < yScale.min || NORMAL_BODY_TEMP > yScale.max) {
                    return;
                }

                const yPosition = yScale.getPixelForValue(NORMAL_BODY_TEMP);

                ctx.save();

                ctx.beginPath();
                ctx.moveTo(chartArea.left, yPosition);
                ctx.lineTo(chartArea.right, yPosition);
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'rgba(34, 197, 94, 0.95)';
                ctx.setLineDash([7, 6]);
                ctx.stroke();

                const label = 'Normal 98.6°F';
                ctx.font = 'bold 12px sans-serif';

                const textWidth = ctx.measureText(label).width;
                const labelX = chartArea.right - textWidth - 12;
                const labelY = yPosition - 8;

                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(34, 197, 94, 0.95)';
                ctx.fillRect(labelX - 6, labelY - 14, textWidth + 12, 20);

                ctx.fillStyle = '#ffffff';
                ctx.fillText(label, labelX, labelY);

                ctx.restore();
            }
        };

        // ==================== Chart ====================
        function updateChart() {
            const canvas = document.getElementById('feverChart');
            const ctx = canvas.getContext('2d');

            if (chartInstance) {
                chartInstance.destroy();
                chartInstance = null;
            }

            const profileLogs = state.logs.filter(function(log) {
                return log.profileId === state.activeProfileId;
            });

            if (!state.activeProfileId || profileLogs.length === 0) {
                drawEmptyChartMessage(
                    ctx,
                    canvas,
                    state.activeProfileId ? 'No temperature logs yet' : 'Create or select a profile to begin'
                );
                return;
            }

            const tempPoints = profileLogs.map(function(log) {
                return {
                    x: log.timestamp,
                    y: log.temperature,
                    logId: log.id
                };
            });

            const mainDataset = {
                label: 'Temperature (°F)',
                data: tempPoints,
                type: 'line',
                borderColor: '#3B82F6',
                borderWidth: 3,
                backgroundColor: 'rgba(59, 130, 246, 0.05)',
                fill: false,
                tension: 0.25,
                pointRadius: 5,
                pointBackgroundColor: '#3B82F6',
                pointBorderColor: '#ffffff',
                pointBorderWidth: 2,
                hoverRadius: 8
            };

            const medicationDatasets = state.medications.map(function(med) {
                const medLogs = profileLogs.filter(function(log) {
                    return log.medicationId === med.id;
                });

                return {
                    label: med.name,
                    data: medLogs.map(function(log) {
                        return {
                            x: log.timestamp,
                            y: log.temperature,
                            logId: log.id
                        };
                    }),
                    type: 'scatter',
                    backgroundColor: med.color,
                    borderColor: med.color,
                    borderWidth: 2,
                    radius: 7,
                    hoverRadius: 10,
                    pointStyle: 'rectRounded'
                };
            });

            const datasets = [mainDataset].concat(medicationDatasets);

            const rawMinTime = Math.min.apply(null, tempPoints.map(function(point) {
                return point.x;
            }));

            const rawMaxTime = Math.max.apply(null, tempPoints.map(function(point) {
                return point.x;
            }));

            const minTime = floorToThreeHourBlock(rawMinTime) - THREE_HOURS_MS;
            const maxTime = ceilToThreeHourBlock(rawMaxTime) + THREE_HOURS_MS;

            chartInstance = new Chart(ctx, {
                type: 'scatter',
                data: {
                    datasets: datasets
                },
                plugins: [dayBackgroundPlugin, normalBodyTempPlugin],
                options: {
                    responsive: true,
                    maintainAspectRatio: false,

                    parsing: false,

                    interaction: {
                        mode: 'nearest',
                        intersect: true
                    },

                    onClick: function(event, elements) {
                        if (!elements || elements.length === 0) {
                            return;
                        }

                        const clickedElement = elements[0];
                        const dataset = this.data.datasets[clickedElement.datasetIndex];
                        const point = dataset.data[clickedElement.index];

                        if (point && point.logId) {
                            openEditLog(point.logId);
                        }
                    },

                    plugins: {
                        legend: {
                            display: true,
                            position: 'top',
                            labels: {
                                font: {
                                    size: 12,
                                    weight: 'bold'
                                },
                                padding: 15,
                                usePointStyle: true
                            }
                        },

                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const date = new Date(context.parsed.x);
                                    const temp = context.parsed.y;

                                    const dateLabel = date.toLocaleDateString([], {
                                        month: 'short',
                                        day: 'numeric'
                                    });

                                    const timeLabel = date.toLocaleTimeString([], {
                                        hour: 'numeric',
                                        minute: '2-digit'
                                    });

                                    return `${context.dataset.label}: ${temp}°F @ ${dateLabel} ${timeLabel}`;
                                }
                            }
                        }
                    },

                    scales: {
                        x: {
                            type: 'linear',
                            min: minTime,
                            max: maxTime,

                            title: {
                                display: true,
                                text: 'Date / Time'
                            },

                            ticks: {
                                stepSize: THREE_HOURS_MS,
                                autoSkip: false,
                                maxRotation: 0,
                                minRotation: 0,

                                callback: function(value) {
                                    const date = new Date(value);
                                    const hour = date.getHours();
                                    const minute = date.getMinutes();

                                    // At midnight, show only the date.
                                    // Do not show 12 AM underneath.
                                    if (hour === 0 && minute === 0) {
                                        return date.toLocaleDateString([], {
                                            month: 'short',
                                            day: 'numeric'
                                        });
                                    }
                            
                                    // Show shortened time every 3 hours, without ":00".
                                    let displayHour = hour % 12;
                                    if (displayHour === 0) {
                                        displayHour = 12;
                                    }
                            
                                    const amPm = hour < 12 ? 'AM' : 'PM';
                            
                                    return `${displayHour} ${amPm}`;

                                },

                                color: function(context) {
                                    const value = context && context.tick ? context.tick.value : null;
                                    return isLocalMidnight(value) ? '#1D4ED8' : '#374151';
                                },

                                font: function(context) {
                                    const value = context && context.tick ? context.tick.value : null;
                                    const midnight = isLocalMidnight(value);

                                    return {
                                        size: midnight ? 12 : 10,
                                        weight: midnight ? 'bold' : 'normal'
                                    };
                                }
                            },

                            grid: {
                                drawBorder: true,
                                drawOnChartArea: true,

                                color: function(context) {
                                    const value = context && context.tick ? context.tick.value : null;

                                    return isLocalMidnight(value)
                                        ? 'rgba(37, 99, 235, 0.55)'
                                        : 'rgba(0, 0, 0, 0.06)';
                                },

                                lineWidth: function(context) {
                                    const value = context && context.tick ? context.tick.value : null;
                                    return isLocalMidnight(value) ? 2 : 1;
                                }
                            }
                        },

                        y: {
                            beginAtZero: false,
                            min: 95,
                            max: 106,

                            title: {
                                display: true,
                                text: 'Temperature (°F)'
                            },

                            ticks: {
                                callback: function(value) {
                                    return Number(value).toFixed(1);
                                }
                            },

                            grid: {
                                drawBorder: true,
                                color: 'rgba(0, 0, 0, 0.05)'
                            }
                        }
                    }
                }
            });
        }

        function drawEmptyChartMessage(ctx, canvas, message) {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save();
            ctx.fillStyle = '#9CA3AF';
            ctx.font = '14px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(message, canvas.width / 2, canvas.height / 2);
            ctx.restore();
        }

        // ==================== Storage / Utilities ====================
        function saveState() {
            localStorage.setItem('feverTrackerState', JSON.stringify(state));
        }

        function loadState() {
            const saved = localStorage.getItem('feverTrackerState');

            if (!saved) {
                return;
            }

            try {
                const parsed = JSON.parse(saved);

                state = {
                    profiles: Array.isArray(parsed.profiles) ? parsed.profiles : [],
                    medications: Array.isArray(parsed.medications) ? parsed.medications : [],
                    logs: Array.isArray(parsed.logs) ? parsed.logs : [],
                    activeProfileId: parsed.activeProfileId || null
                };
            } catch (error) {
                console.error('Could not load saved tracker data:', error);
            }
        }

        function clearAllData() {
            if (!confirm('Start a new illness tracker? This will delete all current profiles, medications, and logs from this device. Export JSON first if you want to keep a copy')) {
                return;
            }

            state = {
                profiles: [],
                medications: [],
                logs: [],
                activeProfileId: null
            };

            saveState();
            renderAll();

            alert('Tracker cleared. You can start a new illness now.');
        }

        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#039;');
        }
    </script>
</body>
</html>
