<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Family Fever & Medication Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
    </style>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-gradient-to-r from-blue-600 to-blue-800 text-white p-6 shadow-lg">
            <div class="max-w-7xl mx-auto">
                <h1 class="text-3xl font-bold">🌡️ Family Fever & Medication Tracker</h1>
                <p class="text-blue-100 mt-1">Track temperatures and medications across multiple profiles</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="flex-1 max-w-7xl mx-auto w-full p-4 md:p-6 grid grid-cols-1 lg:grid-cols-4 gap-6">
            
            <!-- Sidebar -->
            <aside class="lg:col-span-1 bg-white rounded-lg shadow-md p-6 h-fit">
                <h2 class="text-xl font-bold text-gray-800 mb-4">Profiles</h2>
                
                <!-- Profile List -->
                <div id="profileList" class="space-y-2 mb-4">
                    <!-- Profiles rendered here -->
                </div>

                <!-- Add Profile -->
                <div class="flex gap-2 mb-6">
                    <input 
                        id="newProfileInput" 
                        type="text" 
                        placeholder="New profile name" 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                        onkeypress="if(event.key==='Enter') addProfile()"
                    >
                    <button 
                        onclick="addProfile()" 
                        class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-semibold"
                    >
                        +
                    </button>
                </div>

                <hr class="mb-6">

                <!-- Medication Manager -->
                <h3 class="font-bold text-gray-800 mb-3">Medications</h3>
                <div id="medicationList" class="space-y-2 mb-4 max-h-48 overflow-y-auto">
                    <!-- Medications rendered here -->
                </div>

                <!-- Add Medication -->
                <div class="flex gap-2 mb-4">
                    <input 
                        id="newMedicationInput" 
                        type="text" 
                        placeholder="Medication name" 
                        class="flex-1 px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none text-sm"
                        onkeypress="if(event.key==='Enter') addMedication()"
                    >
                    <button 
                        onclick="addMedication()" 
                        class="px-3 py-2 bg-green-600 text-white rounded-lg hover:bg-green-700 transition-colors text-sm font-semibold"
                    >
                        +
                    </button>
                </div>

                <hr class="mb-6">

                <!-- Clear Data -->
                <button 
                    onclick="clearAllData()" 
                    class="w-full px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors font-semibold text-sm"
                >
                    🗑️ Clear All Data
                </button>
            </aside>

            <!-- Main Panel -->
            <section class="lg:col-span-3 space-y-6">
                
                <!-- Data Input Form -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Log Temperature & Medication</h2>
                    
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
                        <!-- Temperature Input -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Temperature (°F)</label>
                            <input 
                                id="tempInput" 
                                type="number" 
                                placeholder="98.6" 
                                min="95" 
                                max="106" 
                                step="0.1"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            >
                        </div>

                        <!-- Date Input -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Date</label>
                            <input 
                                id="dateInput" 
                                type="date"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            >
                        </div>

                        <!-- Time Input -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Time</label>
                            <input 
                                id="timeInput" 
                                type="time" 
                                step="900"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            >
                        </div>

                        <!-- Medication Select -->
                        <div>
                            <label class="block text-sm font-semibold text-gray-700 mb-2">Medication</label>
                            <select 
                                id="medicationSelect"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent outline-none"
                            >
                                <option value="">— None —</option>
                            </select>
                        </div>
                    </div>

                    <button 
                        onclick="logEntry()" 
                        class="w-full px-4 py-3 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors font-bold"
                    >
                        Log Entry
                    </button>
                </div>

                <!-- Chart -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-1">Temperature Timeline</h2>
                    <p class="text-xs text-gray-500 mb-4">💡 Hint: Click on any point in the plot below to edit or delete that entry.</p>
                    <div style="position: relative; height: 350px;">
                        <canvas id="feverChart"></canvas>
                    </div>
                </div>

                <!-- Log History -->
                <div class="bg-white rounded-lg shadow-md p-6">
                    <h2 class="text-xl font-bold text-gray-800 mb-4">Recent Logs</h2>
                    <div id="logHistory" class="space-y-2 max-h-64 overflow-y-auto text-sm text-gray-600">
                        <!-- Logs rendered here -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Edit Point Modal Trigger Overlay -->
    <div id="editModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center hidden z-50 p-4">
        <div class="bg-white rounded-lg shadow-xl max-w-md w-full p-6 space-y-4">
            <h3 class="text-lg font-bold text-gray-900">✏️ Edit Log Entry</h3>
            <input type="hidden" id="editEntryId">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Temperature (°F)</label>
                <input id="editTempInput" type="number" step="0.1" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
            </div>
            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Date</label>
                    <input id="editDateInput" type="date" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-1">Time</label>
                    <input id="editTimeInput" type="time" step="900" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500">
                </div>
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Medication</label>
                <select id="editMedicationSelect" class="w-full px-3 py-2 border rounded-lg outline-none focus:ring-2 focus:ring-blue-500"></select>
            </div>
            <div class="flex flex-wrap justify-between items-center pt-2 gap-2">
                <button onclick="deleteModalEntry()" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 font-semibold text-sm">Delete Entry</button>
                <div class="flex gap-2">
